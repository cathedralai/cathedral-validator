name: validator image

on:
  pull_request:
    paths:
      - "deploy/validator-docker/**"
      - "deploy/validator-update/install_updater_bundle.py"
      - "deploy/validator-update/cathedral-validator-status"
      - "scripts/install.sh"
      - ".github/workflows/validator-image.yml"
  push:
    branches:
      - main
    tags:
      - "validator-image-v*"
    paths:
      - "deploy/validator-docker/**"
      - "deploy/validator-update/install_updater_bundle.py"
      - "deploy/validator-update/cathedral-validator-status"
      - "scripts/install.sh"
      - ".github/workflows/validator-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and smoke the bootstrap image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build ghcr.io/cathedralai/cathedral-validator
        run: |
          docker build \
            --file deploy/validator-docker/Dockerfile \
            --tag ghcr.io/cathedralai/cathedral-validator:ci \
            .

      - name: Offline container smoke
        run: |
          bash deploy/validator-docker/smoke/smoke.sh \
            --image ghcr.io/cathedralai/cathedral-validator:ci \
            --skip-build

      - name: Push only on a version tag
        if: startsWith(github.ref, 'refs/tags/validator-image-v')
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          tag="ghcr.io/cathedralai/cathedral-validator:${GITHUB_REF_NAME}"
          docker tag ghcr.io/cathedralai/cathedral-validator:ci "${tag}"
          docker push "${tag}"
          docker inspect --format='{{index .RepoDigests 0}}' "${tag}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
