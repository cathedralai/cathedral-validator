name: release expiry alarm

# Validators refuse expired signed release metadata and new installs refuse an
# expired bootstrap manifest. Nothing renews either automatically, so this
# fails every day from five days before any of them expires until a key holder
# renews it (docs/RENEW_RELEASE_CHANNEL.md).
#
# A scheduled workflow notifies only whoever last edited its cron line, so the
# second job also keeps one open issue assigned to the key holder: GitHub emails
# the assignee on each failing day, and the issue closes when the check passes.
# Set the repository variable RELEASE_EXPIRY_ASSIGNEE to change who is assigned.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-expiry-alarm
  cancel-in-progress: false

jobs:
  expiry:
    name: Signed release metadata and bootstrap expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fail when anything expires within 5 days
        id: check
        shell: bash
        run: |
          set +e
          python3 scripts/check_release_expiry.py --warn-days 5 > expiry-report.txt 2>&1
          status=$?
          cat expiry-report.txt
          {
            echo 'report<<CATHEDRAL_EXPIRY_REPORT'
            head -c 4000 expiry-report.txt
            echo
            echo 'CATHEDRAL_EXPIRY_REPORT'
          } >> "$GITHUB_OUTPUT"
          exit "$status"

  notify:
    name: Assign the expiry issue to the key holder
    needs: expiry
    if: always() && (needs.expiry.result == 'success' || needs.expiry.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # This job checks out nothing and runs no repository code.
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASSIGNEE: ${{ vars.RELEASE_EXPIRY_ASSIGNEE || 'wallscaler' }}
      RESULT: ${{ needs.expiry.result }}
      REPORT: ${{ needs.expiry.outputs.report }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the expiry issue
        shell: bash
        run: |
          title="Release channel expiry alarm"
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ "${RESULT}" = "success" ]; then
            if [ -n "${number}" ]; then
              gh issue close "${number}" --comment "The daily expiry check passes again: ${RUN_URL}"
            fi
            exit 0
          fi
          body="$(printf '@%s the daily release expiry check failed: %s\n\n```\n%s\n```\n\nRenew with docs/RENEW_RELEASE_CHANNEL.md.\n' \
            "${ASSIGNEE}" "${RUN_URL}" "${REPORT}")"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}" --assignee "${ASSIGNEE}" \
              || gh issue create --title "${title}" --body "${body}"
          fi
