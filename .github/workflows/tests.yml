name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `integration` is included deliberately. Without it nine tests/thin
      # modules importorskip the shared cathedral-distill contract and this job
      # sees 241 passed / 9 skipped instead of 409 / 4 -- 168 tests, roughly 40%
      # of the thin suite, silently not running on the gating path. They are
      # whole-module skips, one line each, so the summary looks unremarkable.
      #
      # The Integration lane job below also runs those files and gates on them,
      # so this is belt AND braces on purpose: that job selects them by the
      # glob test_integration_*.py, and a future contract-dependent test named
      # anything else would be covered by neither job. Here the whole directory
      # runs, so coverage does not depend on a filename.
      - name: Install the validator with its test, publisher and integration extras
        run: python -m pip install -e ".[test,publisher,integration]"

      - name: Lint the thin subnet tree
        run: |
          ruff check cathedral_thin tests/thin
          ruff format --check cathedral_thin tests/thin

      # A skipped contract is a failure here, not a pass. Without this an
      # importorskip turns an uninstallable dependency into a green run
      # reporting "9 skipped", which is exactly how 168 tests stop running
      # without anyone noticing.
      - name: Refuse to pass on a skipped contract
        run: |
          python - <<'PY'
          import importlib, sys
          for module in ("cathedral_distill.integrated_feed", "cathedral_distill.testing"):
              try:
                  importlib.import_module(module)
              except ImportError as exc:
                  sys.exit(
                      f"{module} did not import ({exc}). tests/thin gates on the "
                      "shared contract; a skip here is a failure, not a pass."
                  )
          print("shared contract imported; the full thin suite will run")
          PY

      - name: Thin subnet tests
        run: python -m pytest -q tests/thin

      - name: Boundary tests (the SAT lane stays out)
        run: python -m pytest -q tests/boundary

      - name: Compile every tracked Python file
        run: git ls-files '*.py' | xargs python -m py_compile

  manifest:
    # Exercises the origin manifest against a real upstream clone, and proves
    # the verifier actually gates rather than printing success unconditionally.
    name: Origin manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Clone upstream at the derived-from SHA
        run: |
          set -euo pipefail
          sha=$(awk '/^# Upstream:/ {print $NF}' MANIFEST.origin.tsv)
          echo "derived-from: $sha"
          git clone --quiet https://github.com/cathedralai/cathedral.git /tmp/cathedral-upstream
          git -C /tmp/cathedral-upstream checkout --quiet "$sha"

      - name: Verify byte-identity against upstream
        run: ./tools/manifest.sh verify /tmp/cathedral-upstream

      - name: Prove the verifier rejects tampering
        run: ./tools/manifest.sh selftest /tmp/cathedral-upstream

      # The sync tool had no gating coverage at all, which is how a re-sync
      # silently reverted a declared divergence (config/validator-mainnet-sn39.toml
      # lost [logs].status_jsonl, and the public status unit could then never
      # satisfy its ConditionPathExists). Its selftest proves a local addition
      # survives AND that a declared divergence is never overwritten.
      - name: Prove a sync preserves local additions and declared divergences
        run: ./tools/sync-from-upstream.sh selftest /tmp/cathedral-upstream

  publisher:
    # Advisory, not gating. The publisher suite carries failures inherited from
    # upstream in any environment without PostgreSQL and outbound network. They
    # are not caused by the extraction: the same tests fail identically in an
    # upstream checkout, verified at fd02392d. This job exists to make drift
    # visible, so a NEW failure can be told apart from the inherited set.
    #
    # test_required_ci_collection_gate_returns_zero is deselected because it
    # asserts on upstream's .github/workflows/two-mode-provenance.yml, which
    # this repo deliberately does not carry. See BOUNDARY.md.
    name: Publisher suite (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,publisher]"
      - run: |
          python -m pytest -q scaffold/publisher/tests \
            --deselect scaffold/publisher/tests/test_validator_two_mode.py::test_required_ci_collection_gate_returns_zero

  integration:
    # GATING. Exercises the default-OFF Compute+Distill integration lane against the
    # shared contract shipped by cathedral-distill (the '.[integration]' extra).
    #
    # This was advisory while cathedral-distill was private: the extra could not
    # install in CI, the modules importorskipped, and a hard failure would have been
    # a permissions artefact rather than a real result. cathedral-distill is public
    # now and the extra installs unauthenticated, so the only reason to tolerate a
    # skip is gone.
    #
    # Tolerating it was not free. These ~168 tests cover replay/consumption ordering,
    # epoch-proof binding to the credited set, and the lane-id guard -- reward-path
    # correctness, all of it. Under `continue-on-error` a genuine regression there
    # reported green. They gate now.
    name: Integration lane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # No `|| true`: the extra is public and installable, so a failure here is a
      # real break (a bad pin, an unreachable dependency) and must not be swallowed.
      - run: python -m pip install -e ".[test,integration]"
      # Fail if the contract modules did NOT import. Without this an importorskip
      # turns a broken dependency into a green run reporting "9 skipped", which is
      # exactly how 168 tests can silently stop running.
      - name: Refuse to pass on a skipped contract
        run: |
          python - <<'PY'
          import importlib, sys
          for module in ("cathedral_distill.integrated_feed", "cathedral_distill.testing"):
              try:
                  importlib.import_module(module)
              except ImportError as exc:
                  sys.exit(
                      f"{module} did not import ({exc}). The integration lane gates on "
                      "the shared contract; a skip here is a failure, not a pass."
                  )
          print("shared contract imported; the lane will run for real")
          PY
      # The whole integration family: contract-pin, replay, authoritative
      # single-flight, containment, CLI, and no-chain-write regressions.
      - run: python -m pytest -q tests/thin/test_integration_*.py
