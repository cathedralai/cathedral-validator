name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  private-key-custody:
    name: Reject tracked private PEM keys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refuse private-key PEM markers in tracked files
        run: |
          private_pem='-----BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
          if printf '%s\n' '-----BEGIN PUBLIC KEY-----' | grep -Eq -- "$private_pem"; then
            echo 'The private-key pattern must not reject public PEM.'
            exit 1
          fi
          matches="$(git grep -lE -- "$private_pem" || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo 'Tracked private PEM material is forbidden. Public PEM is allowed.'
            exit 1
          fi

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `integration` is included deliberately. Without it nine tests/thin
      # modules importorskip the shared cathedral-distill contract and this job
      # sees 241 passed / 9 skipped instead of 409 / 4 -- 168 tests, roughly 40%
      # of the thin suite, silently not running on the gating path. They are
      # whole-module skips, one line each, so the summary looks unremarkable.
      #
      # The Integration lane job below also runs those files and gates on them,
      # so this is belt AND braces on purpose: that job selects them by the
      # glob test_integration_*.py, and a future contract-dependent test named
      # anything else would be covered by neither job. Here the whole directory
      # runs, so coverage does not depend on a filename.
      - name: Install the validator with all release-contract extras
        run: python -m pip install -e ".[test,publisher,provenance,integration]"

      - name: Lint the thin subnet tree
        run: |
          ruff check cathedral_thin tests/thin
          ruff format --check cathedral_thin tests/thin

      # A skipped contract is a failure here, not a pass. Without this an
      # importorskip turns an uninstallable dependency into a green run
      # reporting "9 skipped", which is exactly how 168 tests stop running
      # without anyone noticing.
      - name: Refuse to pass on a skipped contract
        run: |
          python - <<'PY'
          import importlib, sys
          for module in (
              "cathedral_distill.integrated_feed",
              "cathedral_distill.testing",
              "cathedral_distill.cybergym_score_report",
          ):
              try:
                  importlib.import_module(module)
              except ImportError as exc:
                  sys.exit(
                      f"{module} did not import ({exc}). tests/thin gates on the "
                      "shared contract; a skip here is a failure, not a pass."
                  )
          print("shared contract imported; the full thin suite will run")
          PY

      - name: Thin subnet tests
        run: python -m pytest -q tests/thin

      - name: Boundary tests (the SAT lane stays out)
        run: python -m pytest -q tests/boundary

      - name: Compile every tracked Python file
        run: git ls-files '*.py' | xargs python -m py_compile

  snp-production:
    name: AMD SEV-SNP production contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # Keep this separate from the historical provenance extra. Both provide
      # the `cathedral` distribution, but only this exact Sandbox revision is
      # the reviewed production SNP contract.
      - name: Install the exact production SNP contract
        run: python -m pip install -e ".[test,snp-production]"

      - name: Verify the pinned production dependency and vendor verifier
        env:
          SNPGUEST: ${{ runner.temp }}/snpguest
          SNP_POLICY: ${{ runner.temp }}/amd-sev-snp-policy.json
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$SNPGUEST" \
            https://github.com/virtee/snpguest/releases/download/v0.10.0/snpguest
          printf '%s  %s\n' \
            70e700465e3523e67dd5104583dc36cd11eef630c6f04c5b9ccafd6ba2e76ca0 \
            "$SNPGUEST" | sha256sum --check -
          chmod 0500 "$SNPGUEST"
          printf '%s\n' \
            '{"schema":"cathedral_amd_sev_snp_policy_v1","generations":{"genoa":{"allowed_measurements":["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"],"minimum_tcb":"0x0000000000000001"}}}' \
            > "$SNP_POLICY"
          chmod 0600 "$SNP_POLICY"
          python - <<'PY'
          import os
          from cathedral_thin.independent.collect import ChannelBinding, CollectedEvidence
          from cathedral_thin.independent.compute import QuoteVerdict
          from cathedral_thin.independent_runtime.snp_production import (
              SANDBOX_CONTRACT_COMMIT,
              SnpProductionVerifier,
              load_snp_policy,
          )

          verifier = SnpProductionVerifier(
              policy=load_snp_policy(os.environ["SNP_POLICY"]),
              snpguest_path=os.environ["SNPGUEST"],
          )
          assert verifier._contract.commit == SANDBOX_CONTRACT_COMMIT
          assert verifier.digest.startswith("sha256:")
          malformed = CollectedEvidence(
              kind="sev_snp",
              quote=b"malformed-miner-report",
              nonce=b"n" * 32,
              assigned_hotkey="miner-hotkey",
              cert_chain=(),
              channel_binding=ChannelBinding("tls_spki_sha256", b"c" * 32),
              report_data=b"r" * 64,
          )
          result = verifier.verify(malformed)
          assert result.verdict is QuoteVerdict.FAIL
          print(f"production SNP contract {SANDBOX_CONTRACT_COMMIT} loaded")
          PY

      - name: AMD production verification tests
        run: |
          python -m pytest -q \
            tests/thin/test_snp_production.py \
            tests/thin/test_amd_snp_dev_preview.py \
            tests/thin/test_direct_validator.py \
            tests/thin/test_independent_collect.py

  publisher:
    # GATING for the validator-facing tests, advisory for the rest.
    #
    # This job used to run the whole publisher suite under `continue-on-error`
    # as its ONLY step, with a comment claiming that "job-level handling still
    # reports a red PR check". That is false: step-level continue-on-error
    # yields a job conclusion of `success`, so the check could never go red.
    # Run 30983128053 on main reported this job green while
    # test_validator_thin_validated_supply.py had ten failing tests -- and that
    # is exactly how they rotted unnoticed for nine days, on the file that
    # covers core weight-mapping and UID-replacement safety.
    #
    # So the validator-facing files are now REQUIRED steps, and the rest of the
    # publisher suite keeps its advisory posture in a separate step that is
    # allowed to fail. Advisory is a fine status for legacy fixtures; it is not
    # a fine status for the tests that cover the write path.
    #
    # #88 promoted only test_validator_thin_validated_supply.py, which left the
    # chain weight-cooldown safety guards (#76) defended by an advisory file.
    # Mutation testing confirmed the gap: deleting the cooldown stand-down,
    # re-seeding its anchor every tick, and downgrading an unreadable cooldown
    # to a routine skip ALL survived tests/thin, tests/boundary and the one
    # required publisher file. Only test_validator_lifecycle.py caught them, and
    # it could not fail the build. It is required now, for the same reason.
    name: Publisher suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,publisher]"
      # REQUIRED. Covers the validator's own weight-mapping and UID-replacement
      # safety. A failure here is a failure. It must also not be able to pass
      # vacuously: a collection error or an empty selection exits non-zero
      # rather than reporting "no tests ran" as success.
      - name: Validator-facing publisher tests (required)
        run: |
          python -m pytest -q --no-header \
            scaffold/publisher/tests/test_validator_thin_validated_supply.py \
            scaffold/publisher/tests/test_validator_thin_uid30_successor.py
      # REQUIRED. Covers the tick lifecycle, endpoint/credential sanitization,
      # the durable attempt fence, and the chain weight-cooldown stand-down --
      # the guards that decide whether a refused write is a skip or a fault.
      # Same vacuous-pass rule: a collection error exits non-zero.
      - name: Validator lifecycle and cooldown guards (required)
        run: |
          python -m pytest -q --no-header \
            scaffold/publisher/tests/test_validator_lifecycle.py
      # Advisory: legacy publisher fixtures still being reconciled with the
      # canonical validator output. Allowed to fail, and its failure is visible
      # in the step, but it does not gate.
      - name: Legacy publisher compatibility (advisory)
        continue-on-error: true
        run: |
          python -m pytest -q scaffold/publisher/tests \
            --ignore=scaffold/publisher/tests/test_validator_thin_validated_supply.py \
            --ignore=scaffold/publisher/tests/test_validator_thin_uid30_successor.py \
            --ignore=scaffold/publisher/tests/test_validator_lifecycle.py

  integration:
    # GATING. Exercises the default-OFF Compute+Distill integration lane against the
    # shared contract shipped by cathedral-distill (the '.[integration]' extra).
    #
    # This was advisory while cathedral-distill was private: the extra could not
    # install in CI, the modules importorskipped, and a hard failure would have been
    # a permissions artefact rather than a real result. cathedral-distill is public
    # now and the extra installs unauthenticated, so the only reason to tolerate a
    # skip is gone.
    #
    # Tolerating it was not free. These ~168 tests cover replay/consumption ordering,
    # epoch-proof binding to the credited set, and the lane-id guard -- reward-path
    # correctness, all of it. Under `continue-on-error` a genuine regression there
    # reported green. They gate now.
    name: Integration lane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # No `|| true`: the extra is public and installable, so a failure here is a
      # real break (a bad pin, an unreachable dependency) and must not be swallowed.
      - run: python -m pip install -e ".[test,publisher,integration]"
      # Fail if the contract modules did NOT import. Without this an importorskip
      # turns a broken dependency into a green run reporting "9 skipped", which is
      # exactly how 168 tests can silently stop running.
      - name: Refuse to pass on a skipped contract
        run: |
          python - <<'PY'
          import importlib, sys
          for module in (
              "cathedral_distill.integrated_feed",
              "cathedral_distill.testing",
              "cathedral_distill.cybergym_score_report",
          ):
              try:
                  importlib.import_module(module)
              except ImportError as exc:
                  sys.exit(
                      f"{module} did not import ({exc}). The integration lane gates on "
                      "the shared contract; a skip here is a failure, not a pass."
                  )
          print("shared contract imported; the lane will run for real")
          PY
      # The whole integration family: contract-pin, replay, authoritative
      # single-flight, containment, CLI, and no-chain-write regressions.
      - run: python -m pytest -q tests/thin/test_integration_*.py
      # This boundary test intentionally is not named test_integration_*.py.
      # Keep it explicit: it drives the immutable Distill report producer,
      # loopback intake, restart/idempotence, and the non-writing preview.
      - run: python -m pytest -q tests/thin/test_cybergym_prelaunch_e2e.py

  validator-release:
    # GATING. This is the installability proof for the signed auto-update
    # artifact. Unit tests use a deliberately small PEX-shaped fixture. This
    # job instead resolves the production SNP extra, builds the real validator
    # twice, validates the exact bundle accepted by the offline signer,
    # extracts the fixed release tree, and drives the packaged runtime through
    # its pre-write systemd readiness boundary with external effects doubled.
    name: Real validator release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned offline release tooling
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --requirement \
            "$GITHUB_WORKSPACE/requirements/release-build-cpython312-ubuntu2404-x86_64.lock"

      - name: Lint the release boundary
        run: |
          ruff check \
            cathedral_thin/independent_runtime/updater.py \
            deploy/validator-update/build_signed_release.py \
            deploy/validator-update/build_updater_bundle.py \
            deploy/validator-update/compose_updater_requirements.py \
            deploy/validator-update/install_updater_bundle.py \
            deploy/validator-update/publish_github_bootstrap.py \
            deploy/validator-update/publish_github_channel.py \
            tests/release_smoke/run_real_validator.py
          ruff format --check \
            cathedral_thin/independent_runtime/updater.py \
            deploy/validator-update/build_signed_release.py \
            deploy/validator-update/build_updater_bundle.py \
            deploy/validator-update/compose_updater_requirements.py \
            deploy/validator-update/install_updater_bundle.py \
            deploy/validator-update/publish_github_bootstrap.py \
            deploy/validator-update/publish_github_channel.py \
            tests/release_smoke/run_real_validator.py

      - name: Build the reviewed project wheel twice
        env:
          PIP_NO_INDEX: "1"
          SOURCE_DATE_EPOCH: "0"
        run: |
          python -m pip wheel --no-cache-dir --no-build-isolation --no-deps \
            "$GITHUB_WORKSPACE" \
            --wheel-dir /tmp/cathedral-validator-project-one
          python -m pip wheel --no-cache-dir --no-build-isolation --no-deps \
            "$GITHUB_WORKSPACE" \
            --wheel-dir /tmp/cathedral-validator-project-two
          python - <<'PY'
          import os
          from pathlib import Path

          first = list(Path("/tmp/cathedral-validator-project-one").glob("*.whl"))
          second = list(Path("/tmp/cathedral-validator-project-two").glob("*.whl"))
          if len(first) != 1 or len(second) != 1:
              raise SystemExit("project wheel build did not produce one artifact")
          if (
              first[0].name != second[0].name
              or first[0].read_bytes() != second[0].read_bytes()
          ):
              raise SystemExit("project wheel build is not reproducible")
          PY

      - name: Build the real relocatable validator twice from the committed lock
        run: |
          project_wheel="$(find /tmp/cathedral-validator-project-one -maxdepth 1 -name '*.whl' -print -quit)"
          project_requirement="cathedral-scaffold[snp-production] @ file://${project_wheel}"
          compute_requirement='cathedral @ git+https://github.com/cathedralai/cathedral-sandbox.git@8dde6eaca27116eed53386a1fa33ec70b74a01fb'
          for compute_requirements_pex in /tmp/cathedral-compute-requirements-one.pex /tmp/cathedral-compute-requirements-two.pex; do
            pex \
              "$compute_requirement" \
              --lock requirements/validator-release-cpython312-linux-x86_64.pex.lock \
              --python "$(command -v python)" \
              --interpreter-constraint 'CPython==3.12.*' \
              --inherit-path=false \
              --no-compile \
              --strip-pex-env \
              --python-shebang '/usr/bin/python3.12' \
              --output-file "$compute_requirements_pex"
          done
          cmp /tmp/cathedral-compute-requirements-one.pex /tmp/cathedral-compute-requirements-two.pex
          compute_requirements_pex=/tmp/cathedral-compute-requirements-one.pex
          for output in /tmp/cathedral-validator-one.pex /tmp/cathedral-validator-two.pex; do
            pex \
              --requirements-pex "$compute_requirements_pex" \
              --lock requirements/validator-release-cpython312-linux-x86_64.pex.lock \
              --project "$project_requirement" \
              --python "$(command -v python)" \
              --interpreter-constraint 'CPython==3.12.*' \
              --entry-point cathedral_thin.independent_runtime.direct_validator:main \
              --validate-entry-point \
              --inherit-path=false \
              --no-compile \
              --strip-pex-env \
              --python-shebang '/usr/bin/python3.12' \
              --output-file "$output"
            chmod 0555 "$output"
          done
          cmp /tmp/cathedral-validator-one.pex /tmp/cathedral-validator-two.pex

      - name: Bind the real PEX to the committed runtime lock
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import zipfile
          from pathlib import Path

          lock = Path("requirements/validator-release-cpython312-linux-x86_64.pex.lock")
          pex = Path("/tmp/cathedral-validator-one.pex")
          with zipfile.ZipFile(io.BytesIO(pex.read_bytes()), mode="r") as bundle:
              info = bundle.read("PEX-INFO")
              distributions = json.loads(info)["distributions"]
          document = {
              "schema": "cathedral_validator_pex_distributions_v1",
              "runtime_lock_sha256": hashlib.sha256(lock.read_bytes()).hexdigest(),
              "pex_sha256": hashlib.sha256(pex.read_bytes()).hexdigest(),
              "pex_info_sha256": hashlib.sha256(info).hexdigest(),
              "distributions": distributions,
          }
          Path("/tmp/cathedral-validator.pex-distributions.json").write_text(
              json.dumps(document, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="ascii",
          )
          PY

      - name: Validate, extract, and start the exact signed-release payload
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output /tmp/cathedral-tdx-verifier \
            https://github.com/cathedralai/cathedral-sandbox/releases/download/cathedral-tdx-verifier-v1.0.0/cathedral-tdx-verifier-linux-amd64
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output /tmp/snpguest \
            https://github.com/virtee/snpguest/releases/download/v0.10.0/snpguest
          printf '%s  %s\n' \
            4b6fbaf12def5e4284b54f557c5c29e472d7666f0160a11a5472fdcf462db148 \
            /tmp/cathedral-tdx-verifier | sha256sum --check -
          printf '%s  %s\n' \
            70e700465e3523e67dd5104583dc36cd11eef630c6f04c5b9ccafd6ba2e76ca0 \
            /tmp/snpguest | sha256sum --check -
          chmod 0555 /tmp/cathedral-tdx-verifier /tmp/snpguest
          python - <<'PY'
          import os
          import runpy
          from pathlib import Path

          builder = runpy.run_path(
              "deploy/validator-update/build_signed_release.py"
          )
          pex = Path("/tmp/cathedral-validator-one.pex")
          release = Path("/tmp/cathedral-validator-release")
          builder["_validator_pex"](pex)
          builder["validator_release_tree"](
              pex,
              release,
              qvl=Path("/tmp/cathedral-tdx-verifier"),
              snpguest=Path("/tmp/snpguest"),
              runtime_lock=(
                  Path(os.environ["GITHUB_WORKSPACE"])
                  / "requirements"
                  / "validator-release-cpython312-linux-x86_64.pex.lock"
              ),
              runtime_distributions=Path(
                  "/tmp/cathedral-validator.pex-distributions.json"
              ),
              source_revision=os.environ["GITHUB_SHA"],
          )
          PY
          sudo chown -R root:root /tmp/cathedral-validator-release
          sudo install -d -o nobody -m 0700 /tmp/cathedral-validator-pex-root
          sudo install -d -o nobody -m 0700 /tmp/cathedral-validator-nobody-home
          sudo install -o nobody -m 0444 \
            "$GITHUB_WORKSPACE/tests/release_smoke/run_real_validator.py" \
            /tmp/cathedral-validator-release-smoke.py
          cd /tmp
          sudo -u nobody env \
            HOME=/tmp/cathedral-validator-nobody-home \
            CATHEDRAL_RELEASE_SMOKE_PEX_ROOT=/tmp/cathedral-validator-pex-root \
            CATHEDRAL_RELEASE_SMOKE_CHECKOUT="$GITHUB_WORKSPACE" \
            PEX_ROOT=/tmp/cathedral-validator-pex-root \
            PEX_INTERPRETER=1 \
            /tmp/cathedral-validator-release/bin/cathedral-validator \
            /tmp/cathedral-validator-release-smoke.py
          sudo -u nobody env \
            HOME=/tmp/cathedral-validator-nobody-home \
            PEX_ROOT=/tmp/cathedral-validator-pex-root \
            PEX_INTERPRETER=1 \
            /tmp/cathedral-validator-release/bin/cathedral-validator \
            -m cathedral_thin.independent_runtime.telemetry_exporter --help
