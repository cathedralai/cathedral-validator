[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cathedral-scaffold"
version = "4.0.0-rc.4"
description = "Cathedral SN39 - thin validator for verifiable ML inference and integrity canaries"
requires-python = ">=3.11"
# Validator-runtime deps only. The thin validator generates challenges, scores
# miners locally, and sets weights through Bittensor. The publisher's server
# stack (FastAPI, psycopg2, boto3) remains optional so this path needs no owner
# API, database, queue, object store, or solver farm.
dependencies = [
    "cryptography>=42",
    "bittensor>=10.4,<11",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Origin publisher runtime (compose + publish). Pinned to the exact
# versions in deploy/publisher/requirements.txt so `pip install .[publisher]`
# reproduces the serving lock the compose/publish gates pass under. Keep the two
# lists in lockstep; bump only with a green re-run of the compose-role suite.
publisher = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "starlette==1.2.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.29",
    "cryptography==48.0.0",
    "bittensor-wallet==4.1.0",
    "blake3==1.0.8",
    "psycopg2-binary==2.9.10",
    "boto3==1.35.99",
    # Test-only client (scaffold/publisher/tests/test_mechanism_weightset.py);
    # not part of the runtime serving lock in deploy/publisher/requirements.txt.
    "httpx2>=2",
]
test = [
    "pytest>=8",
    # Cross-library fixture: requests signed by bittensor-wallet must verify
    # with the primitive used inside the measured worker.
    "py-sr25519-bindings>=0.2,<1",
    # Ruff 0.16 expands the default rule set against the pre-existing thin
    # subnet tree. Keep required CI reproducible at the reviewed baseline until
    # that separate migration is performed deliberately.
    "ruff==0.15.13",
]
# Full-provenance validator mode: independently verifies Cathedral's published
# evidence chain (policy registry, signed score reports, assurance receipts)
# and recomputes the weight vector.
#
# The archive URL and digest match the root-managed reproduction lock. The
# pinned Compute revision reserves the `cathedral-validator` console script for
# this package. Update the commit, archive digest, release builder, source pin,
# and regression tests together. Never use a mutable branch ref.
#
# 2026-08-15: the digest changed from 02b95787... to 559dd8e3... with NO change
# to the pinned commit. GitHub re-generated the auto-archive with different gzip
# output, so the bytes moved while the tree did not. Verified before re-pinning:
# the tarball was extracted and hashed file-by-file against a clone checked out
# at 26ebdbb, and both trees digest to 15567727dcd2ea8a738d77f465a40bc906151a45
# 9e6fadcd1f7800a25dd9f2f1. Content identical, compression only.
#
# This is the second time an unchanged tree has invalidated this pin (#16 was
# the cathedralconfidential -> cathedral-compute rename). The `integration`
# extra below already uses `git+https://...@<commit-sha>`, which is immune
# because a commit SHA addresses the tree rather than an archive's bytes. This
# extra cannot follow it yet: sn39-reproduction.lock installs under pip
# hash-checking, and a VCS URL cannot carry `--hash=`. Tracked separately.
provenance = [
    "cathedral @ https://github.com/cathedralai/cathedral-compute/archive/26ebdbb885746f1835ea67ff314e384b4838560f.tar.gz#sha256=559dd8e347dcf635a76d4f930f251184fa09948ad3173ba36211a967c1f5d46e",
]
# Default-OFF Compute+Distill integration lane (cathedral-validator#1). Pulls the
# shared receipt/lane/config contract from cathedral-distill so this validator can
# independently verify Compute (TDX CPU + confidential GPU) and Distill receipts and
# PREVIEW one audited vector — non-writing, never the live thin path.
#
# cathedral-distill is PUBLIC, so this extra installs unauthenticated — no token,
# no SSH agent, no org secret. It was private when this was written, which is why
# the integration CI job used to tolerate the extra failing to install; that job
# gates now (see .github/workflows/tests.yml).
#
# The `git+https://…@<commit-sha>` form is kept deliberately over the
# `archive/<ref>.tar.gz#sha256=` form used by the provenance extra above. A GitHub
# auto-generated tarball embeds the repository name as its top-level directory, so
# renaming the repo changes the archive bytes and invalidates a hash pin that
# nothing inside the repository touched — which is exactly what broke the
# provenance extra when cathedralconfidential became cathedral-compute
# (cathedral-validator#16). A commit SHA IS the immutable pin: this extra came
# through both that rename and cathedral-distill's move to public unchanged.
#
# Pinned to an immutable reviewed Distill commit, never a mutable branch ref.
# This revision adds `compute_work_evidence` and the `work_evidence` keyword to
# `verify_lane_receipt`: a Compute receipt is creditable only after the exact
# SAT item/result bytes committed by its signed digests replay under
# `sat_work_units_v1`. The validator forwards this sidecar from `LaneReceipt`
# and rejects plain receipt-only Compute submissions. Keep this pin and
# DISTILL_CONTRACT_COMMIT in integration.py in lockstep; a regression test
# asserts their exact equality.
integration = [
    "cathedral-cybergym @ git+https://github.com/cathedralai/cathedral-distill.git@b2ad1eddf9235921f8f680342605d5c8a84a8d87",
]
# Development-only AMD SEV-SNP verifier/client contract. This is the exact
# reviewed cathedral-compute merge commit from cathedral-sandbox#181. The
# command also verifies PEP 610 VCS provenance at runtime and refuses a local,
# wheel-only, mutable, or different tree.
snp-dev = [
    "cathedral @ git+https://github.com/cathedralai/cathedral-compute.git@5268443104fd7717b95ce4c398ddf6229ec4f461",
]

# Validator-owned entry points. Compute uses `cathedral-compute-validator` for
# its worker-side score publisher and must not claim `cathedral-validator`.
[project.scripts]
cathedral-validator = "scaffold.cli:main"
# Origin publisher service: serves scaffold.publisher.server:app (needs the
# '.[publisher]' extra). A thin uvicorn.run wrapper; the deploy image and the
# deploy/publisher/*.service units may also invoke uvicorn directly.
cathedral-publisher-serve = "scaffold.publisher.server:_serve_cli"
# Non-writing Compute+Distill integration preview (needs the '.[integration]' extra).
cathedral-validator-integration-preview = "cathedral_thin.integration_cli:main"
cathedral-candidate-snapshot = "scaffold.snapshot_candidates:main"
cathedral-thin-validator = "cathedral_thin.validator:main"
cathedral-thin-e2e = "cathedral_thin.e2e:main"
cathedral-thin-preflight = "cathedral_thin.preflight:main"
cathedral-thin-score-report = "cathedral_thin.report_cli:main"
cathedral-verified-policy = "cathedral_thin.policy_cli:main"
# Dry-run independent composer (independent_v1). Validates config, identity,
# and genesis pin. Ships no chain writer and has no --broadcast or --canary flag.
cathedral-independent-validator = "cathedral_thin.independent.launcher:main"
cathedral-independent-live = "cathedral_thin.independent_runtime.run:main"
# Dedicated signed-fleet preview. Its import graph contains no Cloud client,
# canary writer, journal, account nonce, extrinsic, or submission transport.
cathedral-multicompute-preview = "cathedral_thin.independent_runtime.fleet_preview:main"
# Development-only AMD SEV-SNP preview. It has no writer mode and loads the
# exact Compute verifier/client dependency lazily.
cathedral-amd-sev-snp-dev-preview = "cathedral_thin.independent_runtime.amd_snp_dev_preview:main"
# Historical launch implementations remain only behind recovery-only commands.
# Stale old console-script shims import the same fail-closed source mains.
cathedral-miner-axon-recover = "cathedral_thin.independent_runtime.miner_axon_cli:main"
cathedral-uid30-recover = "cathedral_thin.uid30_launch:main"
# Preview-only proof for two distinct physical machines behind the pinned miner
# UID. This entry point has no submit, recover, confirm, or chain-writer mode.
cathedral-uid30-fleet-preview = "cathedral_thin.uid30_fleet_preview:main"
# One immutable transition from the finalized two-UID predecessor to UID124.
# Submit has one signed-attempt budget. Recovery never signs or resubmits.
cathedral-uid30-fleet-submit = "cathedral_thin.uid30_fleet_submit:main"

[tool.setuptools.packages.find]
include = ["scaffold*", "cathedral_thin*"]
