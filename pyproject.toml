[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cathedral-scaffold"
version = "4.0.0-rc.4"
description = "Cathedral SN39 - thin validator for verifiable ML inference and integrity canaries"
requires-python = ">=3.11"
# Validator-runtime deps only. The thin validator generates challenges, scores
# miners locally, and sets weights through Bittensor. The publisher's server
# stack (FastAPI, psycopg2, boto3) remains optional so this path needs no owner
# API, database, queue, object store, or solver farm.
dependencies = [
    "cryptography>=42",
    "bittensor>=10.4,<11",
    "numpy>=1.24",
]

[project.optional-dependencies]
publisher = [
    "fastapi>=0.115",
    "httpx2>=2",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "bittensor-wallet>=4.1.0",
    "blake3>=1.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.35",
]
test = [
    "pytest>=8",
    # Ruff 0.16 expands the default rule set against the pre-existing thin
    # subnet tree. Keep required CI reproducible at the reviewed baseline until
    # that separate migration is performed deliberately.
    "ruff==0.15.13",
]
# Full-provenance validator mode: independently verifies Cathedral's published
# evidence chain (policy registry, signed score reports, assurance receipts)
# and recomputes the weight vector.
#
# Pinned by COMMIT SHA over a `git+https://` URL, not by sha256 over a GitHub
# auto-generated tarball. The tarball form was tried and broke
# (cathedral-validator#16): GitHub builds those archives with the repository name
# as the top-level directory, so renaming cathedralconfidential -> cathedral-compute
# changed the archive bytes and invalidated the digest while nothing inside the
# repository changed. Both URLs still serve byte-identical files
# (2384833b…), and the commit pin was always fine — only the digest went stale.
#
# That failure mode is the reason for the form, not just the URL. A stale digest
# surfaces as "THESE PACKAGES DO NOT MATCH THE HASHES … someone may have tampered
# with them", which reads as an attack rather than as a moved URL, and it is a
# second thing to maintain that a rename can invalidate on its own. A commit SHA
# IS the immutable pin: content-addressed by git, unaffected by the repository
# name. The integration extra below has used this form throughout and came through
# both that rename and cathedral-distill's move to public untouched.
#
# It also failed asymmetrically: `pip` enforced the fragment and refused, while
# `uv` installed it regardless. So the break was invisible to half the toolchain,
# which is its own argument against carrying a second digest.
#
# RECONCILED at the aa79135 sync, deliberately NOT adopting upstream's version.
# cathedral#421 fixed the same break upstream by moving the digest to 2384833b…
# and keeping the tarball form. Upstream has no choice there: its copy of this pin
# has to match requirements/sn39-reproduction.lock, and `pip --require-hashes`
# rejects VCS requirements outright, so a hash-locked file cannot use a commit pin.
# This repo does not ship that constraint into the extra, so it keeps the form that
# a rename cannot invalidate at all. The two are pinned to the SAME COMMIT and
# resolve to the same bytes; only the addressing differs.
#
# The visible cost of the divergence: upstream's
# test_immutable_install_binds_venv_and_masks_legacy_writer asserts
# `"#sha256=" + EXPECTED_CATHEDRAL_ARCHIVE_SHA256 in pyproject`, which cannot hold
# here. That test already failed in this repo before this change, on a different
# assertion (the status/jsonl log-group split), so this costs no additional test.
# Recorded in BOUNDARY.md rather than left to be rediscovered.
#
# Update ONLY together with the reviewed release process (never a mutable ref).
provenance = [
    "cathedral @ git+https://github.com/cathedralai/cathedral-compute.git@655c264421a1f5f2e625a372a40f595aa1e114ab",
]
# Default-OFF Compute+Distill integration lane (cathedral-validator#1). Pulls the
# shared receipt/lane/config contract from cathedral-distill so this validator can
# independently verify Compute (TDX CPU + confidential GPU) and Distill receipts and
# PREVIEW one audited vector — non-writing, never the live thin path.
#
# cathedral-distill is PUBLIC, so this extra installs unauthenticated — no token,
# no SSH agent, no org secret. It was private when this was written, which is why
# the integration CI job used to tolerate the extra failing to install; that job
# gates now (see .github/workflows/tests.yml).
#
# The `git+https://…@<commit-sha>` form is kept deliberately over the
# `archive/<ref>.tar.gz#sha256=` form used by the provenance extra above. A GitHub
# auto-generated tarball embeds the repository name as its top-level directory, so
# renaming the repo changes the archive bytes and invalidates a hash pin that
# nothing inside the repository touched — which is exactly what broke the
# provenance extra when cathedralconfidential became cathedral-compute
# (cathedral-validator#16). A commit SHA IS the immutable pin: this extra came
# through both that rename and cathedral-distill's move to public unchanged.
#
# Pinned to an immutable commit on cathedral-distill main (mirrors the provenance
# extra's discipline: never a mutable branch ref). Re-pinned past distill#22-#28
# (9 commits since the prior 79e9370 pin). Of the modules this repo imports
# (integrated_feed, signed_config, consumption_ledger, receipt_keys, testing),
# only integrated_feed.py changed: verify_lane_receipt's `consumption_ledger`
# lost its `None` default and is now a required keyword (distill#28 D-4 -- the
# old default silently returned PASS/REPLAY_NONE with no ledger, so a caller
# that never learned the keyword existed had no replay gate at all). Compatible
# as-is: every call site here already passes consumption_ledger explicitly,
# either a real ledger with defer_consumption=True or the NO_REPLAY_LEDGER
# sentinel via _no_replay_sentinel_or_none(). Verified byte-identical: signed_config,
# consumption_ledger, receipt_keys, testing. Update ONLY together with a review
# of what changed, and keep DISTILL_CONTRACT_COMMIT in integration.py in
# lockstep (a test asserts they match).
integration = [
    "cathedral-cybergym @ git+https://github.com/cathedralai/cathedral-distill.git@b7929b69668ca34dd150029bb9d2c5198a339ada",
]

# Validator-side entry points only. The upstream repo additionally ships
# cathedral-game, cathedral-arena*, cathedral-audit-scanner-smoke (SAT lane,
# game/ is not part of this repo), cathedral-thin-miner and
# cathedral-thin-contributor (miner lane), and cathedral-verifyml. Those modules
# that live inside cathedral_thin/ are still importable here because the package
# is copied whole; only the console-script entry points are withheld.
# See BOUNDARY.md.
[project.scripts]
cathedral-validator = "scaffold.cli:main"
# Non-writing Compute+Distill integration preview (needs the '.[integration]' extra).
cathedral-validator-integration-preview = "cathedral_thin.integration_cli:main"
cathedral-candidate-snapshot = "scaffold.snapshot_candidates:main"
cathedral-thin-validator = "cathedral_thin.validator:main"
cathedral-thin-e2e = "cathedral_thin.e2e:main"
cathedral-thin-preflight = "cathedral_thin.preflight:main"
cathedral-thin-score-report = "cathedral_thin.report_cli:main"
cathedral-verified-policy = "cathedral_thin.policy_cli:main"

[tool.setuptools.packages.find]
include = ["scaffold*", "cathedral_thin*"]
