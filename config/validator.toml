# Cathedral SN39 validator config (v4) — an ANNOTATED REFERENCE, not the
# profile to run. A third-party validator copies
# config/validator-thin-sn39-relay.toml; see README's quickstart, which is the
# one install-and-run path in this repository.
#
# Security-critical SN39 launch and journal settings cannot be weakened by
# ambient environment variables. Non-security settings CAN be: environment
# beats this file, so a stray CATHEDRAL_VALIDATOR_STATE export silently
# replaces the state_file below and later fails the immutable trust profile.
# Prefer the per-command --state-file / --runtime-root / --jsonl flags.

[network]
name = "finney"
netuid = 39
wallet_name = "validator"        # your coldkey wallet name
validator_hotkey = "default"     # your validator hotkey
# Connect to your own subtensor RPC node instead of the public finney
# entrypoint. Set via env var (redirects only the connection — the "finney"
# signing label is unchanged, so signed vectors still verify):
#   export CATHEDRAL_CHAIN_ENDPOINT="wss://my-node.example:443"
# Must be a bittensor-compatible ws/wss node on the same chain (genesis/UIDs).

[publisher]
url = "https://api.cathedral.computer"

[weight_policy]
# The key the orchestrator signs the weight vector with — pin it and the
# validator refuses any vector not signed by exactly this key. Verify it
# against https://api.cathedral.computer/.well-known/cathedral-jwks.json
public_key_hex = "10890a66aa752479cb3b634f366d7bd27c374324d83f88d2d6b69ab066f25e26"
key_id = "cathedral-weight-policy"
# Launch contract pin: 90% Intel TDX / >=10% burn. Supported SN39 mode.
require_policy = "validated_supply_v1"
# Rollback-fence persistence. Must be an ABSOLUTE path: nothing here expands
# "~" or an environment variable, so a tilde would be taken literally.
# state_file = "/home/you/.cathedral/thin_validator.json"

[runtime]
# Shared single-flight lock and ambiguity journal for recurring submissions and
# bounded launch-journal recovery.
# Create this absolute directory as the validator service account, mode 0700.
root = "/var/lib/cathedral-validator"

[weights]
interval_secs = 1500

[provenance]
# "shadow" is the mode: the thin path submits the signed vector after enforcing
# the weight-policy signature + freshness + rollback fence, while the
# full-provenance verifier independently re-verifies the published evidence
# chain every tick in the background and reports any divergence without ever
# delaying the write. The recurring CLI accepts no mode selector.
# min_assurance (default rewarded_set_proven) gates the concurrent shadow
# verifier's PROVEN labeling, not the thin write path, which submits the signed
# vector after signature verification regardless. Opt down to receipts_only or
# up to full_over_epoch deliberately.
# min_assurance = "rewarded_set_proven"
# evidence_url = "https://api.cathedral.computer/v1/evidence"   # default: publisher + /v1/evidence
# Trusted public-key pins (JSON files mapping key_id -> base64 32-byte key).
# The exact SN39 launch public-key bundle now ships in
# config/provenance/. Pin its bytes independently:
# registry_keys = "config/provenance/registry-keys.json"
# registry_keys_digest = "sha256:5fb8f00cd2541606927373f596c2ba77d4ce485df0539f4afd5091858af48512"
# report_keys = "config/provenance/report-keys.json"
# report_keys_digest = "sha256:30e438fff5b0508402b233eb5eec590a834882801a552edbbf7e62e45cf98c70"
# index_keys = "config/provenance/index-keys.json"
# index_keys_digest = "sha256:1e35b9ce36b3da3362a88feb93dfa90f1fe03ab7c42e902b13ac3789324f7611"
# The pinned Intel TDX verifier implementation digest (from the release notes):
# verifier_digest = "sha256:8292b085e4dbe228f8ffd2ec7046a1c0f1324ff5e7a29d1574ce16963f9b098f"
# The versioned reward mechanism this validator recomputes:
mechanism = "validated_supply_v1"
# A controlled shadow audit may additionally pin the envelope package, verifier
# binary, expected source revision, and burn destination. These strengthen the
# audit and never replace the signed vector submitted by the recurring runtime:
# controlled_dir = "/var/lib/cathedral-controlled/epoch-latest"
# verifier_binary = "/opt/cathedral/bin/cathedral-tdx-verifier"
# source_revision = "26ebdbb885746f1835ea67ff314e384b4838560f"
# burn_hotkey = "5GP7c3fFazW9GXK8Up3qgu2DJBk8inu4aK9TZy3RuoSWVCMi"

[logs]
# Stable machine-readable event stream (one JSON object per line). Absolute
# path only — "~" is not expanded here. Its parent directory is created
# owner-only (0700) if missing; if it cannot be created the validator says so
# and exits rather than raising.
# Watch it:  tail -f "$HOME/.cathedral/validator-events.jsonl" | jq .
# jsonl = "/home/you/.cathedral/validator-events.jsonl"
