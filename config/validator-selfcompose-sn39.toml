# Cathedral SN39 CONSOLIDATED SELF-COMPOSING validator — the documented default
# profile for the single service that both composes/publishes the signed weight
# vector (locally, via the deploy/publisher/ units) AND validates + broadcasts
# it in attestation-verified mode.
#
# Attestation-verified (thin / provenance = "shadow") is the PRINCIPAL mode: the
# on-chain write path enforces the weight-policy signature + freshness + monotonic
# rollback fence and submits exactly the signed vector, winning the chain-finality
# race that a heavy per-tick authority recompute loses. TDX attestation + per-report
# signature verification is compose-side (the publisher) and is re-checked by the
# full-provenance verifier, which runs concurrently in shadow and never delays or
# blocks the submission. Authority is the OPT-IN fallback — see
# config/validator-mainnet-sn39.toml (kept byte-identical).
#
# OPERATIONAL DEPENDENCY: because the shadow verifier is non-blocking, a
# compromised or buggy LOCAL publisher that signs a vector disagreeing with its
# own receipts is DETECTED (PROVENANCE_VECTOR_MISMATCH in the event log) but NOT
# stopped — the bad vector still lands on-chain. Out-of-band alerting on that
# event is REQUIRED; see the rollback runbook (R1/R4 revert to the hub-backed
# producer). This is the deliberate cost of winning the finality race.
#
# The single delta from validator-thin-sn39-relay.toml is the [publisher] url:
# it points at the LOCAL self-composed publisher (cathedral-publisher.service,
# 127.0.0.1:8010) instead of the remote api.cathedral.computer. min_assurance is
# intentionally left at the default (rewarded_set_proven) — it gates only the
# concurrent shadow verifier's PROVEN labeling, never the thin write path, which
# submits the signed vector after signature verification regardless.
#
# CLEAN-JOURNAL REQUIREMENT: attestation-verified must start from a clean/fresh
# journal (state_file below). Never hand-edit a live journal — provision with
# deploy/publisher/init-clean-journal.sh. See deploy/publisher/README.md.

[network]
name = "finney"
netuid = 39
# Your own wallet. Local labels; the release pins the resolved on-chain identity.
wallet_name = "validator"
validator_hotkey = "default"

[publisher]
# The LOCAL self-composed publisher (cathedral-publisher.service). This is the
# one line that makes the validator self-composing: it fetches the signed vector
# from the publisher role running on the same host instead of a remote origin.
url = "http://127.0.0.1:8010"

[weight_policy]
public_key_hex = "10890a66aa752479cb3b634f366d7bd27c374324d83f88d2d6b69ab066f25e26" # pragma: allowlist secret
key_id = "cathedral-weight-policy"
# v2 (90% Intel TDX / 10% burn) — the byte-identical default. Flipped to
# validated_supply_v3 only in the coordinated Phase 5 cutover, paired with the
# publisher-side v3 flip, and only after CyberGym is confirmed healthy.
require_policy = "validated_supply_v1"
state_file = "/var/lib/cathedral-validator/thin-state.json"

[weights]
interval_secs = 1500
# Leave at 0. The durable journal already fences thin reservations to one per
# strictly increasing published policy_version.
max_submissions = 0

[runtime]
# Owner-only, mode 0700, created by the service install / init-clean-journal.sh.
root = "/var/lib/cathedral-validator"

[provenance]
# Attestation-verified: submit the signed vector; the full verifier re-checks
# the published evidence chain (TDX attestation + per-report signatures)
# concurrently in shadow and never blocks the write. The thin submission enforces
# the weight-policy signature + freshness + rollback fence and lands the write
# before chain finality advances — no from-scratch re-derivation and no on-path
# TDX attestation check in the write path, which is what a heavy authority
# recompute loses the race doing.
mode = "shadow"
evidence_url = "https://api.cathedral.computer/v1/evidence"
registry_keys = "config/provenance/registry-keys.json"
registry_keys_digest = "sha256:5fb8f00cd2541606927373f596c2ba77d4ce485df0539f4afd5091858af48512"
report_keys = "config/provenance/report-keys.json"
report_keys_digest = "sha256:30e438fff5b0508402b233eb5eec590a834882801a552edbbf7e62e45cf98c70"
index_keys = "config/provenance/index-keys.json"
index_keys_digest = "sha256:1e35b9ce36b3da3362a88feb93dfa90f1fe03ab7c42e902b13ac3789324f7611"
verifier_digest = "sha256:8292b085e4dbe228f8ffd2ec7046a1c0f1324ff5e7a29d1574ce16963f9b098f"
source_revision = "26ebdbb885746f1835ea67ff314e384b4838560f" # pragma: allowlist secret
mechanism = "validated_supply_v1"
burn_hotkey = "5G3qVaXzKMPDm5AJ3dpzbpUC27kpccBvDwzSWXrq8M6qMmbC" # pragma: allowlist secret
# controlled_dir and verifier_binary are deliberately absent: the raw TDX
# evidence package is Cathedral-controlled, so the shadow audit reports
# receipts_only and never delays or blocks the thin submission.

[launch]
# This consolidated profile relays the signed vector; it performs no launch of
# its own and must not require a per-validator completed launch.
require_full_provenance_for_broadcast = false
require_completed_launch_for_broadcast = false

[logs]
jsonl = "/var/log/cathedral-validator/validator-events.jsonl"
