# Cathedral SN39 mainnet configuration for a THIRD-PARTY thin validator.
#
# This is the third-party ATTESTATION-VERIFIED profile: it relays Cathedral's
# signed weight vector from the REMOTE origin (api.cathedral.computer). For the
# consolidated single-host validator that composes/publishes the vector LOCALLY,
# use config/validator-selfcompose-sn39.toml instead (identical except its
# [publisher] url points at the local publisher).
#
# This profile relays Cathedral's signed weight vector: fetch it, verify it
# against the pinned weight-policy key, and submit exactly those numbers. It
# never originates weights, so it has no launch of its own to complete.
#
# Every trust-bearing value below is re-checked against the release constants
# in scaffold/validator_thin.py before any broadcast. Changing any of them is
# refused, not silently honored. Only wallet identity, log path, and the launch
# section differ from the Cathedral operator profile. (The operator profile,
# config/validator-mainnet-sn39.toml, was removed in PR #39 with the rest of
# the authority/launch ceremony; the release constants remain the authority.)
#
# The operator-facing path for this profile is README's quickstart. A non-root
# preview redirects the three service-owned paths below — [runtime].root,
# [weight_policy].state_file, and [logs].jsonl — with --runtime-root,
# --state-file and --jsonl rather than editing them here.

[network]
name = "finney"
netuid = 39
# Your own wallet. These are local labels; the release pins the resolved
# on-chain identity, not the wallet name.
wallet_name = "validator"
validator_hotkey = "default"

[publisher]
url = "https://api.cathedral.computer"

[weight_policy]
public_key_hex = "10890a66aa752479cb3b634f366d7bd27c374324d83f88d2d6b69ab066f25e26" # pragma: allowlist secret
key_id = "cathedral-weight-policy"
require_policy = "validated_supply_v1"
state_file = "/var/lib/cathedral-validator/thin-state.json"

[weights]
interval_secs = 1500
# Leave at 0. The durable journal already fences thin reservations to one per
# strictly increasing published policy_version, so this is a redundant local
# ceiling. Raising it later after attempts are recorded invalidates the
# journal's budget record.
max_submissions = 0

[runtime]
# Owner-only, mode 0700, created by the service install.
root = "/var/lib/cathedral-validator"

[provenance]
# Authority submits an independent recomputation instead of Cathedral's signed
# vector. It originates weights, so it requires the controlled evidence package
# and the root-signed authorization below; a relay without them must stay on
# validator-thin-sn39-relay.toml.
mode = "authority"
evidence_url = "https://api.cathedral.computer/v1/evidence"
registry_keys = "config/provenance/registry-keys.json"
registry_keys_digest = "sha256:5fb8f00cd2541606927373f596c2ba77d4ce485df0539f4afd5091858af48512"
report_keys = "config/provenance/report-keys.json"
report_keys_digest = "sha256:30e438fff5b0508402b233eb5eec590a834882801a552edbbf7e62e45cf98c70"
index_keys = "config/provenance/index-keys.json"
index_keys_digest = "sha256:1e35b9ce36b3da3362a88feb93dfa90f1fe03ab7c42e902b13ac3789324f7611"
verifier_digest = "sha256:8292b085e4dbe228f8ffd2ec7046a1c0f1324ff5e7a29d1574ce16963f9b098f"
source_revision = "26ebdbb885746f1835ea67ff314e384b4838560f" # pragma: allowlist secret
mechanism = "validated_supply_v1"
burn_hotkey = "5GP7c3fFazW9GXK8Up3qgu2DJBk8inu4aK9TZy3RuoSWVCMi" # pragma: allowlist secret
# The controlled evidence rotates: the exporter writes one directory per epoch
# and repoints `current` after each successful export. Pin the symlink, never an
# epoch directory, or the audit silently replays stale evidence and starts
# refusing on an epoch mismatch a few minutes later.
controlled_dir = "/var/lib/cathedral-validator-controlled-sn39/current"
verifier_binary = "/opt/cathedral/bin/cathedral-tdx-verifier-24a96d5"
# Mandatory in authority mode: every independent chain check is evaluated at the
# anchored candidate block, so without a ceiling the producer chooses the block
# its own evidence is judged against.
#
# Measured on the live producer: the anchor sits 22 blocks behind the finalized
# head and advances every ~26 blocks (300s epochs at 12s blocks). 100 allows
# roughly four epochs of staleness, which is generous for normal jitter and
# still refuses a producer that has stopped exporting. That second property is
# the one worth having: the epoch loop wedged for 17 hours on 2026-08-12 while
# weights kept publishing, and a ceiling this tight turns that into a refusal
# instead of a silent divergence.
max_anchor_lag_blocks = 100

[launch]
# A relay performs no launch transaction.
require_full_provenance_for_broadcast = false
# The SN39 launch is a subnet-level event that happened once. A relay cannot
# perform its own, so requiring a per-validator completed launch would make
# this profile unrunnable. Setting this false is refused for any runtime that
# runs provenance = "authority" or holds the controlled launch material.
require_completed_launch_for_broadcast = false
# Weight-originating hosts (holding launch material) additionally need the
# documented waiver below or the runtime contract refuses the relay opt-out;
# pure third-party relays have no launch material and are unaffected by it.
beta_skip_launch_ceremony = true

[logs]
jsonl = "/var/log/cathedral-validator/validator-events.jsonl"
