# Drop-in for whichever unit runs the SN39 weight writer.
#
# Three limits, each written after the failure it would have prevented.
#
# MemoryMax: on 2026-08-10 the kernel OOM-killed the writer. No unit in this repo
# set any memory bound, so there was nothing for the process to hit before the
# kernel chose for us. A bounded process fails predictably; an unbounded one takes
# whatever the box has and dies at the worst moment.
#
# RestartPreventExitStatus: the crash that followed emitted a remediation reading
# "keep every writer stopped", and systemd restarted it 66 times in 26 minutes
# against that instruction. Restart=always and a poison exit are a contradiction.
# Exit 3 is reserved for "this will not succeed by trying again".
#
# StartLimit: even a retryable failure should stop hammering. Five failures in ten
# minutes means something is wrong that another restart will not fix.

[Service]
MemoryMax=2G
MemoryHigh=1500M
Restart=on-failure
RestartSec=15s
RestartPreventExitStatus=3

[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5
